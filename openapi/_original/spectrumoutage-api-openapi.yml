openapi: 3.0.3
info:
  title: SpectrumOutage API
  version: "1.0.0"
  description: |
    REST API for live Spectrum internet, TV, and phone outage data across the United States.

    Data is community-sourced from user reports on [spectrum outage](https://spectrumoutage.us).
    Not affiliated with Charter Communications or Spectrum™.

    **Rate limit:** 100 requests per minute per API key.

    **Get an API key:** Email [usspectrumoutage@gmail.com](mailto:usspectrumoutage@gmail.com?subject=API%20Key%20Request)
  contact:
    name: spectrum outage
    email: usspectrumoutage@gmail.com
    url: https://spectrumoutage.us/contact
  license:
    name: Community data — attribution required
    url: https://spectrumoutage.us/disclaimer
  termsOfService: https://spectrumoutage.us/terms-of-service

externalDocs:
  description: Full API documentation
  url: https://api.spectrumoutage.us

servers:
  - url: https://spectrumoutage.us/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Stats
    description: Dashboard and aggregate statistics
  - name: Reports
    description: Outage report listing and submission
  - name: Locations
    description: City, state, and ZIP lookup
  - name: Map
    description: Map pin and cluster data

paths:
  /stats:
    get:
      tags: [Stats]
      summary: Get dashboard stats
      description: Returns homepage-style stats — reports last 30 min, trend, today/month totals, cities affected, timeline, and service breakdown.
      operationId: getStats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /reports:
    get:
      tags: [Reports]
      summary: List outage reports
      description: Paginated outage reports, newest first.
      operationId: listReports
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Reports]
      summary: Submit an outage report
      description: Submit a new community outage report. No reCAPTCHA required when using an API key.
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
            example:
              zipCode: "90210"
              serviceType: internet
              startedWhen: just_now
              note: Optional short note
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /cities/{slug}:
    get:
      tags: [Locations]
      summary: Get city outage data
      description: Returns outage stats, map clusters, and recent reports for a city.
      operationId: getCity
      parameters:
        - $ref: "#/components/parameters/citySlug"
      responses:
        "200":
          description: City data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CityNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /states:
    get:
      tags: [Locations]
      summary: List all state report counts
      description: Report counts for every US state (current month).
      operationId: listStates
      responses:
        "200":
          description: State counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatesListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /states/{slug}:
    get:
      tags: [Locations]
      summary: Get state outage data
      description: Returns outage stats, featured cities, and map clusters for a state.
      operationId: getState
      parameters:
        - $ref: "#/components/parameters/stateSlug"
      responses:
        "200":
          description: State data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/StateNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /zip/{zip}:
    get:
      tags: [Locations]
      summary: Check ZIP code status
      description: Returns outage status and recent reports for a 5-digit US ZIP code.
      operationId: getZipStatus
      parameters:
        - $ref: "#/components/parameters/zipCode"
      responses:
        "200":
          description: ZIP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /map:
    get:
      tags: [Map]
      summary: Get map pin data
      description: Returns map clusters and individual pins for outage visualization.
      operationId: getMapData
      parameters:
        - name: range
          in: query
          description: Time window for map data
          schema:
            type: string
            enum: ["1h", "24h", "48h"]
            default: "1h"
      responses:
        "200":
          description: Map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key issued by SpectrumOutage.us. Request at usspectrumoutage@gmail.com

  parameters:
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      description: Results per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    citySlug:
      name: slug
      in: path
      required: true
      description: City slug (e.g. los-angeles, new-york-city, charlotte)
      schema:
        type: string
        example: los-angeles
    stateSlug:
      name: slug
      in: path
      required: true
      description: State slug (e.g. california, texas, new-york)
      schema:
        type: string
        example: california
    zipCode:
      name: zip
      in: path
      required: true
      description: 5-digit US ZIP code
      schema:
        type: string
        pattern: "^\\d{5}$"
        example: "90210"

  responses:
    Unauthorized:
      description: Missing Authorization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Missing API key. Send Authorization: Bearer <key>"
    Forbidden:
      description: Invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid API key."
    RateLimited:
      description: Rate limit exceeded (100 req/min)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Rate limit exceeded. Max 100 requests per minute."
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid report data."
              code: INVALID_INPUT
    CityNotFound:
      description: City slug not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "City not found."
              code: CITY_NOT_FOUND
    StateNotFound:
      description: State slug not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "State not found."
              code: STATE_NOT_FOUND
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: string
          required: [message]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    OutageReport:
      type: object
      properties:
        id:
          type: integer
        zipCode:
          type: string
        serviceType:
          $ref: "#/components/schemas/ServiceType"
        startedWhen:
          $ref: "#/components/schemas/StartedWhen"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ServiceType:
      type: string
      enum: [internet, tv, phone, all]

    StartedWhen:
      type: string
      enum: [just_now, last_hour, few_hours, today, yesterday, days_ago]

    CreateReportInput:
      type: object
      required: [zipCode, serviceType, startedWhen]
      properties:
        zipCode:
          type: string
          pattern: "^\\d{5}$"
          description: 5-digit US ZIP code
        serviceType:
          $ref: "#/components/schemas/ServiceType"
        startedWhen:
          $ref: "#/components/schemas/StartedWhen"
        note:
          type: string
          maxLength: 500
          description: Optional short note

    DashboardStats:
      type: object
      properties:
        reportsLast30Min:
          type: integer
        trend:
          type: string
          enum: [up, down, stable]
        reportsToday:
          type: integer
        reportsThisMonth:
          type: integer
        citiesAffected:
          type: integer
        status:
          type: string
          enum: [all_clear, issues]
        timeline:
          type: array
          items:
            type: object
            properties:
              hour:
                type: string
              count:
                type: integer
        breakdown:
          type: object
          properties:
            internet:
              type: integer
            tv:
              type: integer
            phone:
              type: integer
            all:
              type: integer
        latestReports:
          type: array
          items:
            $ref: "#/components/schemas/OutageReport"
        topAreas:
          type: array
          items:
            type: object
            properties:
              zipCode:
                type: string
              count:
                type: integer
        lastUpdated:
          type: string
          format: date-time

    ZipStatus:
      type: object
      properties:
        zipCode:
          type: string
        status:
          type: string
          enum: [issues_reported, all_clear]
        reports:
          type: array
          items:
            $ref: "#/components/schemas/OutageReport"

    StatsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/DashboardStats"

    ReportResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OutageReport"

    ReportsListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OutageReport"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ZipResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ZipStatus"

    CityResponse:
      type: object
      properties:
        data:
          type: object
          description: City page data including stats, map clusters, and reports

    StateResponse:
      type: object
      properties:
        data:
          type: object
          description: State page data including stats, featured cities, and map clusters

    StatesListResponse:
      type: object
      properties:
        data:
          type: object
          description: State slug to report count mapping

    MapResponse:
      type: object
      properties:
        data:
          type: object
          description: Map clusters, pins, and summary
        meta:
          type: object
          properties:
            range:
              type: string
              enum: ["1h", "24h", "48h"]
