name: SpectrumOutage API
description: >-
  Community-powered REST API for live Spectrum internet, TV, and phone outage data across the United
  States, published by SpectrumOutage.us — an independent outage tracker with no affiliation to Charter
  Communications or Spectrum. The v1 API exposes eight operations over crowdsourced outage reports:
  national dashboard statistics with an hourly timeline and service breakdown, a paginated report feed,
  outage submission, city and state lookups by slug, ZIP-code status (issues_reported / all_clear) with
  the reports behind it, and map pin/cluster data over a 1h, 24h or 48h window. Access is a bearer API
  key issued manually by email, or through a free RapidAPI plan; the provider also publishes an OpenAPI
  3.0.3 specification, an agent-facing llm.txt on both hosts, a Postman collection, and an open outage
  dataset mirrored to GitHub, Hugging Face, Kaggle and Figshare.
